<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Desafio interativo de logaritmos com exercícios de diferentes níveis."
>

<title>Desafio dos Logaritmos</title>

<style>

    /* =====================================================
       VARIÁVEIS
       ===================================================== */

    :root {

        --bg: #0b1120;
        --bg-soft: #111827;

        --panel: rgba(17, 24, 39, 0.88);
        --panel-light: #182235;

        --text: #f8fafc;
        --muted: #aab6c8;

        --primary: #5b8def;
        --primary-hover: #4778df;

        --primary-soft: rgba(91, 141, 239, 0.12);

        --success: #35d07f;
        --success-soft: rgba(53, 208, 127, 0.10);

        --danger: #ff5d68;
        --danger-soft: rgba(255, 93, 104, 0.10);

        --border: rgba(148, 163, 184, 0.16);

        --radius: 18px;

        --shadow:
            0 20px 60px rgba(0, 0, 0, 0.28);
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
    }


    body {

        margin: 0;

        min-height: 100vh;

        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        background:
            radial-gradient(
                circle at 50% -20%,
                rgba(59, 130, 246, 0.14),
                transparent 45%
            ),
            linear-gradient(
                180deg,
                var(--bg),
                #0f172a
            );

        color: var(--text);

        padding: 24px;

        display: flex;
        justify-content: center;
    }


    /* =====================================================
       APP
       ===================================================== */

    .app {

        width: min(920px, 100%);

        display: flex;
        flex-direction: column;
    }


    /* =====================================================
       HOME
       ===================================================== */

    .home-link {

        align-self: flex-start;

        display: inline-flex;

        align-items: center;

        gap: 8px;

        color: var(--muted);

        text-decoration: none;

        font-size: 0.88rem;

        font-weight: 650;

        padding: 7px 10px;

        margin-bottom: 24px;

        border-radius: 8px;

        transition:
            color 0.2s ease,
            background 0.2s ease;
    }


    .home-link:hover {

        color: var(--text);

        background: rgba(255,255,255,0.05);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {

        text-align: center;

        margin-bottom: 26px;
    }


    .eyebrow {

        display: inline-flex;

        align-items: center;

        gap: 7px;

        color: var(--primary);

        font-size: 0.68rem;

        font-weight: 800;

        letter-spacing: 1.6px;

        text-transform: uppercase;

        margin-bottom: 9px;
    }


    h1 {

        margin: 0;

        font-size:
            clamp(2rem, 5vw, 3rem);

        line-height: 1.1;

        letter-spacing: -1.2px;
    }


    .subtitle {

        max-width: 620px;

        margin:
            11px auto 20px;

        color: var(--muted);

        font-size:
            clamp(0.9rem, 2vw, 1rem);

        line-height: 1.55;
    }


    /* =====================================================
       DIFICULDADE
       ===================================================== */

    .difficulty-wrapper {

        display: inline-flex;

        align-items: center;

        gap: 10px;

        background: rgba(255,255,255,0.035);

        border: 1px solid var(--border);

        padding: 6px 8px 6px 13px;

        border-radius: 11px;
    }


    .difficulty-wrapper label {

        color: var(--muted);

        font-size: 0.78rem;

        font-weight: 650;
    }


    .difficulty-wrapper select {

        appearance: none;

        border: 0;

        outline: 0;

        color: var(--text);

        background:
            var(--panel-light);

        border-radius: 7px;

        padding:
            8px 31px 8px 10px;

        font-size: 0.8rem;

        font-weight: 700;

        cursor: pointer;
    }


    .difficulty-wrapper select:focus {

        box-shadow:
            0 0 0 2px
            rgba(91,141,239,0.35);
    }


    /* =====================================================
       HUD
       ===================================================== */

    .hud {

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

        gap: 12px;

        margin-bottom: 18px;
    }


    .hud-card {

        background: var(--panel);

        border:
            1px solid var(--border);

        border-radius: 14px;

        padding: 15px 18px;

        text-align: center;

        backdrop-filter: blur(10px);
    }


    .hud-label {

        color: #8290a5;

        font-size: 0.67rem;

        font-weight: 800;

        text-transform: uppercase;

        letter-spacing: 1px;

        margin-bottom: 5px;
    }


    .hud-value {

        font-size: 1.45rem;

        line-height: 1;

        font-weight: 850;
    }


    .score {
        color: var(--primary);
    }


    .hits {
        color: var(--success);
    }


    .misses {
        color: var(--danger);
    }


    /* =====================================================
       GAME PANEL
       ===================================================== */

    .game-panel {

        background:
            linear-gradient(
                145deg,
                rgba(20, 29, 46, 0.96),
                rgba(14, 22, 37, 0.96)
            );

        border:
            1px solid var(--border);

        border-radius: 22px;

        padding:
            clamp(30px, 6vw, 55px)
            clamp(18px, 5vw, 45px);

        text-align: center;

        box-shadow: var(--shadow);

        position: relative;

        overflow: hidden;
    }


    .game-panel::before {

        content: "";

        position: absolute;

        width: 300px;
        height: 300px;

        border-radius: 50%;

        background:
            rgba(59,130,246,0.045);

        top: -180px;
        left: -100px;

        pointer-events: none;
    }


    /* =====================================================
       EXPRESSÃO MATEMÁTICA
       ===================================================== */

    .equation-wrapper {

        min-height: 130px;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow-x: auto;

        padding:
            10px 4px 18px;

        scrollbar-width: thin;
    }


    .equation {

        position: relative;

        z-index: 1;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        flex-wrap: wrap;

        gap: 0.08em;

        color: var(--text);

        font-family:
            "Cambria Math",
            "STIX Two Math",
            "Times New Roman",
            serif;

        font-size:
            clamp(2.25rem, 7vw, 4.25rem);

        font-weight: 500;

        line-height: 1.25;

        white-space: nowrap;
    }


    /* =====================================================
       LOGARITMO
       ===================================================== */

    .math-log {

        display: inline-flex;

        align-items: baseline;

        position: relative;

        margin-right: 0.05em;
    }


    .math-log .log-word {

        font-style: normal;

        letter-spacing: -0.04em;
    }


    .math-log .log-base {

        font-family:
            "Cambria Math",
            "Times New Roman",
            serif;

        font-size: 0.43em;

        line-height: 1;

        position: relative;

        top: 0.36em;

        margin-left: 0.04em;

        color: var(--primary);

        font-weight: 650;
    }


    /* =====================================================
       EXPOENTE
       ===================================================== */

    .math-sup {

        font-size: 0.52em;

        line-height: 0;

        position: relative;

        top: -0.38em;

        margin-left: 0.02em;
    }


    /* =====================================================
       RAIZ QUADRADA
       ===================================================== */

    .sqrt {

        display: inline-flex;

        align-items: flex-start;

        position: relative;

        margin:
            0 0.06em;

        vertical-align: middle;
    }


    .sqrt-symbol {

        font-family:
            "Times New Roman",
            serif;

        font-size: 1.08em;

        line-height: 0.92;

        font-weight: 400;

        margin-right: -0.015em;

        transform:
            translateY(0.045em);
    }


    .sqrt-content {

        display: inline-flex;

        align-items: center;

        border-top:
            0.065em solid currentColor;

        padding:
            0.04em 0.10em 0 0.07em;

        min-height:
            0.78em;
    }


    /* =====================================================
       PARÊNTESES
       ===================================================== */

    .math-parentheses {

        display: inline-flex;

        align-items: center;

        gap: 0.01em;
    }


    /* =====================================================
       OPERADORES
       ===================================================== */

    .operator {

        display: inline-block;

        margin:
            0 0.08em;

        color: #d8dfeb;

        font-family:
            "Cambria Math",
            "Times New Roman",
            serif;
    }


    /* =====================================================
       INPUT
       ===================================================== */

    .input-group {

        display: flex;

        justify-content: center;

        align-items: stretch;

        gap: 10px;

        margin-top: 10px;

        position: relative;

        z-index: 2;
    }


    #answer-input {

        width: 145px;

        height: 52px;

        background:
            rgba(255,255,255,0.045);

        border:
            2px solid #334155;

        border-radius: 12px;

        outline: none;

        color: var(--text);

        font-size: 1.35rem;

        font-weight: 800;

        text-align: center;

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    #answer-input::placeholder {

        color: #64748b;

        opacity: 0.8;
    }


    #answer-input:focus {

        border-color: var(--primary);

        background:
            rgba(91,141,239,0.06);

        box-shadow:
            0 0 0 4px
            rgba(91,141,239,0.10);
    }


    #answer-input:disabled {

        opacity: 0.65;

        cursor: not-allowed;
    }


    #answer-input::-webkit-inner-spin-button,
    #answer-input::-webkit-outer-spin-button {

        -webkit-appearance: none;

        margin: 0;
    }


    #answer-input {

        -moz-appearance: textfield;
    }


    /* =====================================================
       BOTÕES
       ===================================================== */

    button {

        font-family: inherit;
    }


    .primary {

        min-width: 145px;

        height: 52px;

        padding:
            0 22px;

        border: 0;

        border-radius: 12px;

        background:
            var(--primary);

        color: white;

        font-size: 0.9rem;

        font-weight: 800;

        cursor: pointer;

        box-shadow:
            0 8px 20px
            rgba(59,130,246,0.18);

        transition:
            transform 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    .primary:hover:not(:disabled) {

        background:
            var(--primary-hover);

        transform:
            translateY(-1px);

        box-shadow:
            0 11px 24px
            rgba(59,130,246,0.25);
    }


    .primary:active:not(:disabled) {

        transform:
            translateY(0);
    }


    .primary:disabled {

        opacity: 0.55;

        cursor: not-allowed;
    }


    /* =====================================================
       FEEDBACK
       ===================================================== */

    .feedback {

        min-height: 70px;

        margin-top: 18px;

        padding: 14px 16px;

        border-radius: 12px;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        opacity: 0;

        transform:
            translateY(8px);

        pointer-events: none;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease;
    }


    .feedback.show {

        opacity: 1;

        transform:
            translateY(0);

        pointer-events: auto;
    }


    .feedback.success {

        background:
            var(--success-soft);

        border:
            1px solid
            rgba(53,208,127,0.20);

        color:
            var(--success);
    }


    .feedback.error {

        background:
            var(--danger-soft);

        border:
            1px solid
            rgba(255,93,104,0.20);

        color:
            var(--danger);
    }


    .feedback-title {

        font-size: 1rem;

        font-weight: 800;

        margin-bottom: 4px;
    }


    .feedback-explanation {

        color: var(--muted);

        font-size: 0.87rem;

        font-weight: 450;

        line-height: 1.5;
    }


    .feedback-math {

        color: var(--text);

        font-family:
            "Cambria Math",
            "Times New Roman",
            serif;

        font-size: 1.08em;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

        body {
            padding: 14px;
        }


        .home-link {
            margin-bottom: 18px;
        }


        header {
            margin-bottom: 20px;
        }


        .hud {

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;
        }


        .hud-card {

            padding:
                12px 7px;
        }


        .hud-label {

            font-size:
                0.58rem;
        }


        .hud-value {

            font-size:
                1.25rem;
        }


        .game-panel {

            border-radius: 18px;

            padding:
                28px 13px 25px;
        }


        .equation {

            font-size:
                clamp(
                    2rem,
                    10vw,
                    3rem
                );
        }


        .input-group {

            flex-direction:
                column;

            align-items:
                center;
        }


        #answer-input,
        .primary {

            width: min(
                100%,
                280px
            );
        }


        .difficulty-wrapper {

            width: 100%;

            justify-content:
                center;
        }
    }


    @media (max-width: 360px) {

        .hud-label {

            font-size:
                0.52rem;
        }

        .hud-value {

            font-size:
                1.1rem;
        }
    }

</style>


</head>

<body>

<div class="app">


<!-- =====================================================
     HOME
     ===================================================== -->

<a
    href="../../index.html"
    class="home-link"
>
    <span>←</span>

    Voltar para Home
</a>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

    <div class="eyebrow">
        ✦ DESAFIO MATEMÁTICO
    </div>

    <h1>
        Desafio dos Logaritmos
    </h1>

    <p class="subtitle">
        Descubra o valor do logaritmo.
        Todos os resultados são números inteiros.
    </p>


    <div class="difficulty-wrapper">

        <label for="difficulty">
            Nível
        </label>

        <select id="difficulty">

            <option value="normal">
                Normal · Simples
            </option>

            <option value="dificil">
                Difícil · Propriedades
            </option>

            <option value="extremo">
                Extremo · Raízes
            </option>

        </select>

    </div>

</header>


<!-- =====================================================
     HUD
     ===================================================== -->

<section
    class="hud"
    aria-label="Estatísticas do jogo"
>

    <div class="hud-card">

        <div class="hud-label">
            Pontuação
        </div>

        <div
            class="hud-value score"
            id="ui-score"
        >
            0
        </div>

    </div>


    <div class="hud-card">

        <div class="hud-label">
            Acertos
        </div>

        <div
            class="hud-value hits"
            id="ui-hits"
        >
            0
        </div>

    </div>


    <div class="hud-card">

        <div class="hud-label">
            Erros
        </div>

        <div
            class="hud-value misses"
            id="ui-misses"
        >
            0
        </div>

    </div>

</section>


<!-- =====================================================
     JOGO
     ===================================================== -->

<main class="game-panel">


    <!-- EXPRESSÃO -->

    <div class="equation-wrapper">

        <div
            class="equation"
            id="equation"
            aria-live="polite"
        ></div>

    </div>


    <!-- RESPOSTA -->

    <div class="input-group">

        <input
            type="number"
            id="answer-input"
            placeholder="?"
            inputmode="numeric"
            autocomplete="off"
            aria-label="Resposta"
        >


        <button
            type="button"
            class="primary"
            id="btn-submit"
        >
            Responder
        </button>

    </div>


    <!-- FEEDBACK -->

    <div
        class="feedback"
        id="feedback"
        aria-live="polite"
    ></div>

</main>


</div>

<script>

"use strict";


/* =========================================================
   ELEMENTOS
   ========================================================= */

const uiScore =
    document.getElementById("ui-score");

const uiHits =
    document.getElementById("ui-hits");

const uiMisses =
    document.getElementById("ui-misses");

const equationEl =
    document.getElementById("equation");

const inputEl =
    document.getElementById("answer-input");

const btnSubmit =
    document.getElementById("btn-submit");

const feedbackEl =
    document.getElementById("feedback");

const diffSelect =
    document.getElementById("difficulty");


/* =========================================================
   ESTADO DO JOGO
   ========================================================= */

let score = 0;

let hits = 0;

let misses = 0;

let currentAnswer = null;

let currentExplanation = "";

let gameState = "waiting";


/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function randomInt(min, max) {

    if (
        !Number.isInteger(min) ||
        !Number.isInteger(max) ||
        min > max
    ) {
        throw new Error(
            "Intervalo inválido para randomInt()."
        );
    }

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


/* =========================================================
   CRIA ELEMENTOS MATEMÁTICOS
   ========================================================= */

/*
    Em vez de montar a raiz apenas com texto,
    usamos elementos HTML específicos.

    Isso permite controlar separadamente:

    √
    └── conteúdo
*/


function sqrt(content) {

    return `
        <span class="sqrt">
            <span class="sqrt-symbol">√</span>
            <span class="sqrt-content">
                ${content}
            </span>
        </span>
    `;
}


function sup(content) {

    return `
        <span class="math-sup">
            ${content}
        </span>
    `;
}


function log(base, argument) {

    return `
        <span class="math-log">
            <span class="log-word">log</span>
            <span class="log-base">${base}</span>
        </span>
        <span class="math-parentheses">
            (
            ${argument}
            )
        </span>
    `;
}


function multiplication() {

    return `
        <span class="operator">·</span>
    `;
}


/* =========================================================
   GERAÇÃO DE EXERCÍCIOS
   ========================================================= */

function generateProblem() {

    const difficulty =
        diffSelect.value;


    let displayHTML = "";

    let answer = null;

    let explanation = "";


    /* =====================================================
       NORMAL
       ===================================================== */

    if (difficulty === "normal") {

        const base =
            randomInt(2, 10);


        let maxExponent;

        if (base === 2) {

            maxExponent = 8;

        } else if (base === 3) {

            maxExponent = 5;

        } else if (base <= 5) {

            maxExponent = 4;

        } else {

            maxExponent = 3;
        }


        let exponent =
            randomInt(
                0,
                maxExponent
            );


        /*
            Evita excesso de exercícios
            com resultado 1.
        */

        if (
            exponent === 1 &&
            maxExponent >= 2 &&
            Math.random() > 0.5
        ) {

            exponent =
                randomInt(
                    2,
                    maxExponent
                );
        }


        const argument =
            Math.pow(
                base,
                exponent
            );


        displayHTML =
            `${log(
                base,
                argument
            )} = ?`;


        answer = exponent;


        explanation = `
            ${base}${sup(exponent)}
            = ${argument}.
        `;
    }


    /* =====================================================
       DIFÍCIL
       ===================================================== */

    else if (difficulty === "dificil") {

        if (Math.random() < 0.5) {

            const base =
                randomInt(2, 5);

            const exponent1 =
                randomInt(1, 3);

            const exponent2 =
                randomInt(1, 3);


            const value1 =
                Math.pow(
                    base,
                    exponent1
                );

            const value2 =
                Math.pow(
                    base,
                    exponent2
                );


            displayHTML =
                `${log(
                    base,
                    `${value1}
                    ${multiplication()}
                    ${value2}`
                )} = ?`;


            answer =
                exponent1 +
                exponent2;


            explanation = `
                Pela propriedade da soma:
                log<sub>${base}</sub>(${value1})
                +
                log<sub>${base}</sub>(${value2})
                =
                ${exponent1}
                +
                ${exponent2}
                =
                ${answer}.
            `;

        } else {

            let base1 =
                randomInt(2, 4);

            let base2 =
                randomInt(2, 4);


            /*
                Garante bases diferentes.
            */

            if (base1 === base2) {

                base2 =
                    base1 === 4
                        ? 3
                        : base1 + 1;
            }


            const exponent =
                randomInt(2, 3);


            const combinedBase =
                base1 * base2;


            displayHTML =
                `${log(
                    combinedBase,
                    `${base1}${sup(exponent)}
                    ${multiplication()}
                    ${base2}${sup(exponent)}`
                )} = ?`;


            answer = exponent;


            explanation = `
                ${base1}${sup(exponent)}
                ${multiplication()}
                ${base2}${sup(exponent)}
                =
                (${base1}${multiplication()}${base2})${sup(exponent)}
                =
                ${combinedBase}${sup(exponent)}.
                Portanto, o logaritmo é ${answer}.
            `;
        }
    }


    /* =====================================================
       EXTREMO
       ===================================================== */

    else if (difficulty === "extremo") {

        if (Math.random() < 0.5) {

            const base =
                randomInt(2, 5);


            const exponentInteger =
                randomInt(1, 3);


            const rootExponent =
                randomInt(1, 2) * 2;


            const integerValue =
                Math.pow(
                    base,
                    exponentInteger
                );


            const rootValue =
                Math.pow(
                    base,
                    rootExponent
                );


            const rootAnswer =
                rootExponent / 2;


            displayHTML =
                `${log(
                    base,
                    `${integerValue}
                    ${multiplication()}
                    ${sqrt(rootValue)}`
                )} = ?`;


            answer =
                exponentInteger +
                rootAnswer;


            explanation = `
                ${integerValue}
                =
                ${base}${sup(exponentInteger)}
                e
                √${rootValue}
                =
                ${base}${sup(rootAnswer)}.
                Somando os expoentes:
                ${exponentInteger}
                +
                ${rootAnswer}
                =
                ${answer}.
            `;

        } else {

            const base =
                randomInt(2, 4);


            const totalExponent =
                base === 2
                    ? randomInt(3, 5) * 2
                    : randomInt(2, 3) * 2;


            const exponent1 =
                randomInt(
                    1,
                    totalExponent - 1
                );


            const exponent2 =
                totalExponent -
                exponent1;


            const value1 =
                Math.pow(
                    base,
                    exponent1
                );


            const value2 =
                Math.pow(
                    base,
                    exponent2
                );


            displayHTML =
                `${log(
                    base,
                    `${sqrt(value1)}
                    ${multiplication()}
                    ${sqrt(value2)}`
                )} = ?`;


            answer =
                totalExponent / 2;


            explanation = `
                √(${value1}
                ${multiplication()}
                ${value2})
                =
                √(${Math.pow(
                    base,
                    totalExponent
                )})
                =
                ${base}${sup(
                    `${totalExponent}/2`
                )}
                =
                ${base}${sup(answer)}.
            `;
        }
    }


    /*
        Segurança: caso algum nível seja alterado
        incorretamente, impede que um exercício
        inválido chegue à tela.
    */

    if (
        !Number.isFinite(answer)
    ) {

        console.error(
            "Exercício inválido gerado."
        );

        generateProblem();

        return;
    }


    currentAnswer = answer;

    currentExplanation =
        explanation;


    equationEl.innerHTML =
        displayHTML;


    inputEl.value = "";

    inputEl.disabled = false;

    btnSubmit.disabled = false;

    btnSubmit.textContent =
        "Responder";


    feedbackEl.className =
        "feedback";

    feedbackEl.innerHTML =
        "";


    gameState =
        "waiting";


    /*
        Pequeno atraso evita problemas de foco
        em alguns navegadores após mudança de nível.
    */

    requestAnimationFrame(() => {

        inputEl.focus();

    });
}


/* =========================================================
   FEEDBACK
   ========================================================= */

function showFeedback(
    correct,
    userAnswer
) {

    if (correct) {

        feedbackEl.className =
            "feedback show success";

        feedbackEl.innerHTML = `
            <div class="feedback-title">
                Correto! 🎉
            </div>

            <div class="feedback-explanation">
                ${currentExplanation}
            </div>
        `;

    } else {

        feedbackEl.className =
            "feedback show error";

        feedbackEl.innerHTML = `
            <div class="feedback-title">
                Incorreto.
            </div>

            <div class="feedback-explanation">
                A resposta correta era
                <strong>${currentAnswer}</strong>.
                <br>
                ${currentExplanation}
            </div>
        `;
    }
}


/* =========================================================
   RESPOSTA
   ========================================================= */

function handleSubmit() {

    /*
        Se não estiver aguardando resposta,
        gera o próximo exercício.
    */

    if (
        gameState === "feedback"
    ) {

        generateProblem();

        return;
    }


    if (
        gameState !== "waiting"
    ) {

        return;
    }


    const rawValue =
        inputEl.value.trim();


    /*
        Não aceita campo vazio.
    */

    if (
        rawValue === ""
    ) {

        inputEl.focus();

        return;
    }


    const userAnswer =
        Number(rawValue);


    /*
        Evita NaN e Infinity.
    */

    if (
        !Number.isFinite(userAnswer)
    ) {

        inputEl.focus();

        return;
    }


    inputEl.disabled = true;

    gameState =
        "feedback";


    const correct =
        userAnswer === currentAnswer;


    if (correct) {

        const points =
            diffSelect.value === "normal"
                ? 100
                : diffSelect.value === "dificil"
                    ? 150
                    : 250;


        score += points;

        hits++;

    } else {

        score =
            Math.max(
                0,
                score - 30
            );

        misses++;
    }


    uiScore.textContent =
        score;

    uiHits.textContent =
        hits;

    uiMisses.textContent =
        misses;


    showFeedback(
        correct,
        userAnswer
    );


    btnSubmit.textContent =
        "Próximo Exercício →";


    btnSubmit.focus();
}


/* =========================================================
   EVENTOS
   ========================================================= */

diffSelect.addEventListener(
    "change",
    generateProblem
);


btnSubmit.addEventListener(
    "click",
    handleSubmit
);


inputEl.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            handleSubmit();
        }
    }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

generateProblem();

</script>
