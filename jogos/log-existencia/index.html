<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo: Condição de Existência de Logaritmos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .font-mono { font-family: 'Fira Code', monospace; }
        .math-display {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        .math-base {
            font-size: 0.65em;
            vertical-align: sub;
            margin-left: 2px;
            margin-right: 2px;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center items-start">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Cabeçalho -->
        <div class="bg-indigo-600 text-white text-center py-6 px-4">
            <h1 class="text-3xl font-bold tracking-tight mb-2">JOGO: DOMÍNIO DO LOGARITMO</h1>
            <p class="text-indigo-100 font-medium">Condição de Existência (CE)</p>
        </div>

        <div class="p-6 md:p-8">
            
            <!-- Seleção de Nível -->
            <div class="flex justify-center gap-4 mb-8">
                <button onclick="startGame(1)" id="btn-lvl-1" class="px-6 py-2 rounded-lg font-bold border-2 transition-all bg-indigo-100 border-indigo-600 text-indigo-700 shadow-sm">
                    Nível 1 (1º Grau)
                </button>
                <button onclick="startGame(2)" id="btn-lvl-2" class="px-6 py-2 rounded-lg font-bold border-2 transition-all bg-slate-50 border-slate-300 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">
                    Nível 2 (2º Grau)
                </button>
            </div>

            <!-- Área da Função -->
            <div class="bg-slate-50 rounded-xl border border-slate-200 p-8 text-center mb-8 shadow-inner">
                <p class="text-slate-500 font-semibold mb-4 uppercase text-sm tracking-widest">Analise a função</p>
                <div id="function-display" class="text-4xl md:text-5xl math-display text-slate-800 font-bold">
                    <!-- Gerado via JS -->
                </div>
            </div>

            <!-- Construtor de Condições -->
            <div class="mb-8">
                <p class="text-slate-700 font-bold text-lg mb-2 text-center">Determine o domínio da função (para <span class="font-mono">x ∈ ℝ</span>):</p>
                <p class="text-slate-500 text-sm mb-4 text-center">Dica: Insira a condição <strong>simplificada</strong>. Se houver redundâncias, basta indicar a mais restritiva.</p>
                
                <div class="bg-white border-2 border-indigo-100 rounded-xl p-6 shadow-sm">
                    <div class="flex items-center gap-3 text-lg font-bold text-slate-600 mb-4 border-b pb-2">
                        <span class="font-mono text-indigo-600">CE = { x ∈ ℝ | </span>
                    </div>

                    <!-- Lista de Condições -->
                    <div id="conditions-list" class="flex flex-col gap-3 pl-4 md:pl-12">
                        <!-- Gerado via JS -->
                    </div>

                    <div class="flex items-center gap-3 text-lg font-bold text-slate-600 mt-4 border-t pt-2">
                        <span class="font-mono text-indigo-600">}</span>
                    </div>

                    <div class="mt-6 flex justify-center">
                        <button onclick="addCondition()" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg font-semibold transition-all border border-indigo-200">
                            <span class="text-xl leading-none">+</span> Adicionar regra
                        </button>
                    </div>
                </div>
            </div>

            <!-- Feedback -->
            <div id="feedback-alert" class="hidden mb-6 py-4 px-6 rounded-xl font-medium text-base border transition-all duration-300">
            </div>

            <!-- Botões de Ação -->
            <div class="text-center flex justify-center gap-4">
                <button onclick="verifyConditions()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-3 px-12 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                    VERIFICAR
                </button>
                <button onclick="startGame(currentLevel)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-lg font-bold py-3 px-6 rounded-xl shadow-sm transition-all">
                    NOVA FUNÇÃO
                </button>
            </div>

        </div>
    </div>

    <script>
        let currentLevel = 1;
        let baseFn = null; 
        let logFn = null;  
        let conditions = [];
        let expectedRules = [];
        let verifyCount = 0;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function startGame(level) {
            currentLevel = level;
            verifyCount = 0;
            
            document.getElementById('btn-lvl-1').className = level === 1 
                ? "px-6 py-2 rounded-lg font-bold border-2 transition-all bg-indigo-100 border-indigo-600 text-indigo-700 shadow-sm"
                : "px-6 py-2 rounded-lg font-bold border-2 transition-all bg-slate-50 border-slate-300 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300";
            document.getElementById('btn-lvl-2').className = level === 2 
                ? "px-6 py-2 rounded-lg font-bold border-2 transition-all bg-indigo-100 border-indigo-600 text-indigo-700 shadow-sm"
                : "px-6 py-2 rounded-lg font-bold border-2 transition-all bg-slate-50 border-slate-300 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300";

            generateValidFunction(level);
            
            conditions = [{ id: Date.now(), op: '>', val: '', status: 'neutral' }];
            hideFeedback();
            renderConditions();
        }

        function formatLinear(a, b) {
            let str = "";
            if (a === 1) str += "x";
            else if (a === -1) str += "-x";
            else str += a + "x";

            if (b > 0) str += " + " + b;
            else if (b < 0) str += " - " + Math.abs(b);
            
            return str || "0";
        }

        function formatQuadratic(a, b, c) {
            let str = "";
            if (a === 1) str += "x²";
            else if (a === -1) str += "-x²";
            else str += a + "x²";

            if (b > 0) str += (b === 1 ? " + x" : " + " + b + "x");
            else if (b < 0) str += (b === -1 ? " - x" : " - " + Math.abs(b) + "x");

            if (c > 0) str += " + " + c;
            else if (c < 0) str += " - " + Math.abs(c);
            
            return str || "0";
        }

        function generateValidFunction(level) {
            let valid = false;
            while (!valid) {
                expectedRules = [];
                
                let a1 = [1, 2, 4, -1, -2, -4][Math.floor(Math.random() * 6)];
                let b1 = getRandomInt(-4, 4);
                
                let baseStr = formatLinear(a1, b1);
                let baseDisplay = (b1 !== 0 || a1 < 0) ? `(${baseStr})` : baseStr;

                let v1 = -b1 / a1;
                let o1 = a1 > 0 ? '>' : '<';
                expectedRules.push({ op: o1, val: v1, desc: 'Base > 0' });

                let v2 = (1 - b1) / a1;
                expectedRules.push({ op: '!=', val: v2, desc: 'Base ≠ 1' });

                let logStr = "";
                let a2, b2, c2;

                if (level === 1) {
                    a2 = [1, 2, 4, -1, -2, -4][Math.floor(Math.random() * 6)];
                    b2 = getRandomInt(-5, 5);
                    logStr = formatLinear(a2, b2);
                    
                    baseFn = (x) => a1 * x + b1;
                    logFn = (x) => a2 * x + b2;

                    let v3 = -b2 / a2;
                    let o3 = a2 > 0 ? '>' : '<';
                    expectedRules.push({ op: o3, val: v3, desc: 'Logaritmando > 0' });

                } else {
                    let r1 = getRandomInt(-4, 4);
                    let r2 = getRandomInt(-4, 4);
                    while(r1 === r2) r2 = getRandomInt(-4, 4);
                    
                    a2 = -1;
                    b2 = -a2 * (r1 + r2);
                    c2 = a2 * (r1 * r2);

                    logStr = formatQuadratic(a2, b2, c2);
                    
                    baseFn = (x) => a1 * x + b1;
                    logFn = (x) => a2 * x * x + b2 * x + c2;

                    let minR = Math.min(r1, r2);
                    let maxR = Math.max(r1, r2);
                    expectedRules.push({ op: '>', val: minR, desc: 'Log. > 0 (raiz inf)' });
                    expectedRules.push({ op: '<', val: maxR, desc: 'Log. > 0 (raiz sup)' });
                }

                valid = false;
                for (let x = -50; x <= 50; x += 0.5) {
                    if (baseFn(x) > 1e-6 && Math.abs(baseFn(x) - 1) > 1e-6 && logFn(x) > 1e-6) {
                        valid = true;
                        break;
                    }
                }

                if (valid) {
                    document.getElementById('function-display').innerHTML = `f(x) = log<span class="math-base">${baseDisplay}</span>(${logStr})`;
                }
            }
        }

        // Função para calcular matematicamente as condições simplificadas (removendo redundâncias)
        function simplifyRules(rules) {
            let greaterThan = -Infinity;
            let lessThan = Infinity;
            let notEquals = [];

            rules.forEach(r => {
                if (r.op === '>') greaterThan = Math.max(greaterThan, r.val);
                if (r.op === '<') lessThan = Math.min(lessThan, r.val);
                if (r.op === '!=') notEquals.push(r.val);
            });

            let simplified = [];
            if (greaterThan < lessThan) {
                if (greaterThan !== -Infinity) simplified.push({ op: '>', val: greaterThan });
                if (lessThan !== Infinity) simplified.push({ op: '<', val: lessThan });
                
                // Remove os diferentes (!=) que caem fora do intervalo principal
                let uniqueNotEquals = [...new Set(notEquals)];
                uniqueNotEquals.forEach(val => {
                    if (val > greaterThan && val < lessThan) {
                        simplified.push({ op: '!=', val: val });
                    }
                });
            }
            return simplified;
        }

        function addCondition() {
            conditions.push({ id: Date.now(), op: '>', val: '', status: 'neutral' });
            renderConditions();
        }

        function removeCondition(id) {
            conditions = conditions.filter(c => c.id !== id);
            if (conditions.length === 0) addCondition();
            renderConditions();
        }

        function updateCondition(id, field, value) {
            let cond = conditions.find(c => c.id === id);
            if (cond) {
                cond[field] = value;
                cond.status = 'neutral'; 
                hideFeedback();
            }
            renderConditions();
        }

        function renderConditions() {
            const container = document.getElementById('conditions-list');
            container.innerHTML = '';

            conditions.forEach((cond, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-3 animate-fade-in transition-all";
                
                let selectClass = "text-lg font-mono font-bold border-2 rounded-lg px-2 py-1 focus:outline-none transition-all ";
                let inputClass = "w-24 text-lg font-bold text-center border-2 rounded-lg px-2 py-1 focus:outline-none transition-all ";
                let iconHtml = "";

                if (cond.status === 'correct') {
                    selectClass += "bg-green-50 border-green-500 text-green-700";
                    inputClass += "bg-green-50 border-green-500 text-green-700";
                    iconHtml = `<span class="text-green-500 font-bold ml-1 text-xl">✓</span>`;
                } else if (cond.status === 'incorrect') {
                    selectClass += "bg-red-50 border-red-500 text-red-700";
                    inputClass += "bg-red-50 border-red-500 text-red-700";
                    iconHtml = `<span class="text-red-500 font-bold ml-1 text-xl">✗</span>`;
                } else {
                    selectClass += "bg-slate-50 border-slate-300 text-indigo-700 focus:border-indigo-500";
                    inputClass += "bg-white border-slate-300 focus:border-indigo-500";
                }
                
                row.innerHTML = `
                    <span class="font-mono text-xl text-slate-700 font-bold">x</span>
                    <select onchange="updateCondition(${cond.id}, 'op', this.value)" class="${selectClass}">
                        <option value=">" ${cond.op === '>' ? 'selected' : ''}>&gt;</option>
                        <option value="<" ${cond.op === '<' ? 'selected' : ''}>&lt;</option>
                        <option value=">=" ${cond.op === '>=' ? 'selected' : ''}>&ge;</option>
                        <option value="<=" ${cond.op === '<=' ? 'selected' : ''}>&le;</option>
                        <option value="!=" ${cond.op === '!=' ? 'selected' : ''}>&ne;</option>
                        <option value="=" ${cond.op === '=' ? 'selected' : ''}>=</option>
                    </select>
                    <input type="number" step="any" onchange="updateCondition(${cond.id}, 'val', this.value)" value="${cond.val}" placeholder="..." class="${inputClass}">
                    ${iconHtml}
                    ${index > 0 ? `<button onclick="removeCondition(${cond.id})" class="text-slate-400 hover:text-red-500 transition-colors ml-auto" title="Remover"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>` : `<div class="ml-auto w-8"></div>`}
                `;
                
                if (index > 0) {
                    const andSpan = document.createElement('span');
                    andSpan.className = "font-bold text-slate-400 text-sm uppercase -mt-1 block";
                    andSpan.innerText = "e";
                    container.appendChild(andSpan);
                }
                
                container.appendChild(row);
            });
        }

        function hideFeedback() {
            document.getElementById('feedback-alert').classList.add('hidden');
        }

        function showFeedback(isCorrect, mainMsg, htmlComplement = "") {
            const el = document.getElementById('feedback-alert');
            el.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-300', 'bg-green-50', 'text-green-800', 'border-green-300');
            
            if (isCorrect) {
                el.classList.add('bg-green-50', 'text-green-800', 'border-green-300');
                el.innerHTML = `<div class="font-bold text-lg text-center mb-1">✅ Sucesso!</div><div class="text-center">${mainMsg}</div>${htmlComplement}`;
            } else {
                el.classList.add('bg-red-50', 'text-red-800', 'border-red-300');
                el.innerHTML = `<div class="font-bold text-lg text-center mb-1 text-red-600">❌ Atenção (Tentativa ${verifyCount})</div><div class="text-center">${mainMsg}</div>${htmlComplement}`;
            }

            el.classList.remove('animate-pulse-once');
            void el.offsetWidth;
            el.classList.add('animate-pulse-once');
        }

        function evaluateStudentLogic(x) {
            if (conditions.length === 0) return true;
            for (let c of conditions) {
                let val = parseFloat(c.val);
                if (isNaN(val)) return false;

                if (c.op === '>') { if (!(x > val)) return false; }
                else if (c.op === '<') { if (!(x < val)) return false; }
                else if (c.op === '>=') { if (!(x >= val)) return false; }
                else if (c.op === '<=') { if (!(x <= val)) return false; }
                else if (c.op === '=') { if (!(Math.abs(x - val) < 1e-6)) return false; }
                else if (c.op === '!=') { if (!(Math.abs(x - val) > 1e-6)) return false; }
            }
            return true;
        }

        function verifyConditions() {
            if (conditions.some(c => c.val === '')) {
                showFeedback(false, "Preencha todos os valores numéricos antes de verificar.");
                return;
            }

            verifyCount++;

            // Varredura para conferir domínio real
            let testPoints = new Set();
            for (let x = -30; x <= 30; x += 0.5) testPoints.add(x);
            for (let x = -20; x <= 20; x += 0.05) {
                if (Math.abs(baseFn(x)) < 0.1 || Math.abs(baseFn(x) - 1) < 0.1 || Math.abs(logFn(x)) < 0.1) {
                    testPoints.add(x); testPoints.add(x - 0.01); testPoints.add(x + 0.01);
                }
            }
            
            let isPerfectMatch = true;
            for (let pt of testPoints) {
                let actual = (baseFn(pt) > 1e-6) && (Math.abs(baseFn(pt) - 1) > 1e-6) && (logFn(pt) > 1e-6);
                let student = evaluateStudentLogic(pt);
                if (actual !== student) {
                    isPerfectMatch = false;
                    break;
                }
            }

            // Gerar regras simplificadas para base de verificação
            let simRules = simplifyRules(expectedRules);

            if (isPerfectMatch) {
                // Se a intersecção do aluno for equivalente (matematicamente), fica tudo verde!
                conditions.forEach(c => c.status = 'correct');
                renderConditions();
                showFeedback(true, `Você acertou na tentativa ${verifyCount}! O conjunto de restrições define o domínio com perfeição.`);
            } else {
                // Se estiver errado, marca cada linha comparando com as regras simplificadas ou originais
                conditions.forEach(c => {
                    let uVal = parseFloat(c.val);
                    let isMatch = simRules.some(r => r.op === c.op && Math.abs(r.val - uVal) < 1e-4) || 
                                  expectedRules.some(r => r.op === c.op && Math.abs(r.val - uVal) < 1e-4);
                    c.status = isMatch ? 'correct' : 'incorrect';
                });
                renderConditions();

                // Montar HTML do gabarito simplificado
                let ansHtml = `
                <div class="mt-4 p-4 bg-white rounded-lg border-2 border-red-200 text-slate-800 text-left text-sm md:text-base shadow-sm">
                    <p class="font-bold mb-3 text-red-600 border-b border-red-100 pb-2">Gabarito (Domínio já Simplificado)</p>
                    <ul class="list-disc pl-5 space-y-2">`;
                
                simRules.forEach(r => {
                    let opStr = r.op === '!=' ? '≠' : r.op;
                    let numFmt = Number.isInteger(r.val) ? r.val : parseFloat(r.val.toFixed(2));
                    ansHtml += `<li><span class="font-mono bg-slate-100 border border-slate-200 px-2 py-0.5 rounded font-bold text-indigo-700">x ${opStr} ${numFmt}</span></li>`;
                });
                showFeedback(false, `O domínio está incorreto ou incompleto.<br><strong>Corrija os campos em vermelho ou adicione o que falta e tente novamente.</strong>`, ansHtml);
            }
        }

        window.onload = () => startGame(1);

    </script>
    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-pulse-once { animation: pulseOnce 0.4s ease-out; }
        @keyframes pulseOnce { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); } 
        }
    </style>
</body>
</html>
